<style>
  :root { --navy: #0F172A; --card: #1A2744; --gold: #F5C842; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--navy); color: #E2E8F0; font-family: 'Noto Sans KR', sans-serif; }

  main { max-width: 640px; margin: 0 auto; padding: 76px 16px 96px; }
  @media (min-width: 641px) { main { padding-bottom: 24px; } }

  h1 { font-size: 18px; font-weight: 900; margin: 0 0 4px; text-align: center; }
  .lede { text-align: center; font-size: 12.5px; color: #94A3B8; margin: 0 0 20px; }

  .category-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .category-tab {
    padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    background: var(--card); border: 1px solid rgba(255,255,255,.1); color: #94A3B8; cursor: pointer;
  }
  .category-tab.active { background: linear-gradient(135deg,var(--gold),#E8A800); color: var(--navy); border-color: transparent; }

  .story-list { display: flex; flex-direction: column; gap: 10px; }
  .story-card {
    display: flex; gap: 12px; align-items: center; background: var(--card);
    border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 12px 14px;
    text-decoration: none; color: inherit; transition: border-color .15s ease;
  }
  .story-card:hover { border-color: rgba(245,200,66,.4); }
  .story-thumb {
    width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--navy);
  }
  .story-thumb-fallback {
    width: 64px; height: 64px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(245,200,66,.15), rgba(59,130,246,.1));
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  .story-category { font-size: 10px; color: var(--gold); font-weight: 700; margin: 0 0 3px; }
  .story-title { font-size: 14px; color: #fff; font-weight: 700; margin: 0 0 3px; line-height: 1.4; }
  .story-summary {
    font-size: 12px; color: #8b93a6; margin: 0; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .status-msg { text-align: center; font-size: 13px; color: #94A3B8; padding: 40px 0; }
  .load-more-btn {
    display: block; margin: 20px auto 0; padding: 10px 24px; border-radius: 999px;
    background: var(--card); border: 1px solid rgba(255,255,255,.1); color: #E2E8F0;
    font-size: 12.5px; cursor: pointer;
  }
  .back-home-link { display: block; text-align: center; font-size: 12px; color: #64748B; text-decoration: none; margin-top: 24px; }
</style>
</head>

    <span style="width:8px;height:8px;border-radius:50%;background:#F5C842;"></span>로또슬기

<style>
  @media (max-width: 640px) { #lotto-top-nav { display: none !important; } #lotto-bottom-nav { display: flex !important; } }
  @media (min-width: 641px) { #lotto-top-nav { display: flex !important; } #lotto-bottom-nav { display: none !important; } }
</style>

<main>
  <h1>📖 로또 이야기</h1>
  <p class="lede">세계 각국 복권의 역사와 재미있는 잡학 이야기</p>

  <div class="category-tabs">
    <button class="category-tab active" data-category="">전체</button>
    <button class="category-tab" data-category="world_lottery">세계의 복권</button>
    <button class="category-tab" data-category="history_myth">역사 속 이야기</button>
  </div>

  <div id="statusMsg" class="status-msg">불러오는 중...</div>
  <div class="story-list" id="storyList"></div>
  <button class="load-more-btn" id="loadMoreBtn" style="display:none;">더 보기</button>

  <a href="./index.html" class="back-home-link">← 메인으로</a>
</main>

<script>
(function () {
  const STORIES_API = 'https://lotto.smart-alba.com/api/stories';
  const STORIES_DETAIL_BASE = 'https://lotto.smart-alba.com/stories/';
  const CATEGORY_LABELS = { world_lottery: '세계의 복권', history_myth: '역사 속 이야기' };

  const statusMsg = document.getElementById('statusMsg');
  const storyListEl = document.getElementById('storyList');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const categoryTabs = [...document.querySelectorAll('.category-tab')];

  let currentCategory = '';
  let currentPage = 1;
  let hasMore = true;
  let isLoading = false;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function renderStoryCard(story) {
    const a = document.createElement('a');
    a.className = 'story-card';
    a.href = STORIES_DETAIL_BASE + encodeURIComponent(story.slug ?? '');
    a.target = '_blank';
    a.rel = 'noopener';

    const categoryLabel = CATEGORY_LABELS[story.category] ?? '이야기';
    const thumb = story.hero_image_url
      ? `<img class="story-thumb" src="${escapeHtml(story.hero_image_url)}" alt="">`
      : `<div class="story-thumb-fallback">📖</div>`;

    a.innerHTML = `
      ${thumb}
      <div style="min-width:0;">
        <p class="story-category">${escapeHtml(categoryLabel)}</p>
        <p class="story-title">${escapeHtml(story.title ?? '')}</p>
        <p class="story-summary">${escapeHtml(story.summary ?? '')}</p>
      </div>
    `;
    return a;
  }

  async function loadStories(reset) {
    if (isLoading) return;
    isLoading = true;

    if (reset) {
      currentPage = 1;
      hasMore = true;
      storyListEl.innerHTML = '';
      statusMsg.style.display = 'block';
      statusMsg.textContent = '불러오는 중...';
    }
    loadMoreBtn.style.display = 'none';

    try {
      const params = new URLSearchParams({ page: String(currentPage), per_page: '10' });
      if (currentCategory) params.set('category', currentCategory);

      const res = await fetch(`${STORIES_API}?${params.toString()}`);
      const json = await res.json();
      const stories = json.data ?? [];

      if (reset && stories.length === 0) {
        statusMsg.textContent = '아직 등록된 이야기가 없어요.';
        statusMsg.style.display = 'block';
        return;
      }

      statusMsg.style.display = 'none';
      stories.forEach((story) => storyListEl.appendChild(renderStoryCard(story)));

      const meta = json.meta ?? {};
      hasMore = meta.current_page && meta.last_page ? meta.current_page < meta.last_page : stories.length >= 10;
      loadMoreBtn.style.display = hasMore ? 'block' : 'none';
    } catch (e) {
      console.warn('이야기를 불러오지 못했습니다.', e);
      if (reset) {
        statusMsg.textContent = '이야기를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
        statusMsg.style.display = 'block';
      }
    } finally {
      isLoading = false;
    }
  }

  loadMoreBtn.addEventListener('click', () => {
    currentPage += 1;
    loadStories(false);
  });

  categoryTabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      categoryTabs.forEach((t) => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.category || '';
      loadStories(true);
    });
  });

  loadStories(true);
})();
</script>
