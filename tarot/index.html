<style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* 원래 있던 불투명 그라디언트 대신, 셰이더 캔버스가 배경 역할을 하므로
               아주 옅은 톤 보정용 그라디언트만 살짝 남겨둡니다(가독성용). */
            background-color: transparent;
            background-image:
                radial-gradient(circle at 50% 0%, rgba(16, 18, 37, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 50% 100%, rgba(16, 18, 37, 0.45) 0%, transparent 55%);
            color: #e0e0fb;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ---------- 셰이더 배경 캔버스 ---------- */
        #shaderBackdrop {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #shader-canvas-bg { display: block; width: 100%; height: 100%; }

        header, main { position: relative; z-index: 10; }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(49, 51, 72, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(157, 80, 255, 0.3);
        }

        /* Gold filigree border utility */
        .gold-border { position: relative; }
        .gold-border::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(233, 196, 0, 0.5);
            border-radius: inherit;
            pointer-events: none;
        }

        /* ---------- Tarot Card Spread ---------- */
        .tarot-spread-container {
            position: relative;
            width: 100%;
            height: 360px;
            margin: 1.5rem auto 0;
            max-width: 640px;
            perspective: 1200px;
        }

        .tarot-card-wrapper {
            position: absolute;
            bottom: 20px;
            left: 50%;
            margin-left: -50px;
            width: 100px;
            height: 160px;
            transform-origin: bottom center;
            transform: rotate(var(--r)) translateY(var(--y, 0)) scale(var(--s, 1));
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            z-index: var(--z, 1);
        }

        .tarot-card-wrapper:hover:not(.picked) { --y: -30px; --s: 1.2; z-index: 50 !important; }
        .tarot-card-wrapper:active:not(.picked) { --y: -30px; --s: 1.2; z-index: 60 !important; }

        /* 고른 카드는 부채꼴 안에서는 살짝 가라앉은 상태로 "이미 쓰였다"는 걸 표시 */
        .tarot-card-wrapper.picked {
            opacity: 0.35;
            filter: grayscale(0.6);
            pointer-events: none;
            --y: 6px;
        }

        .tarot-card {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            transform-style: preserve-3d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255,255,255,0.1);
            animation: floatCard 4s ease-in-out infinite;
            animation-delay: calc(var(--i) * -0.15s);
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .tarot-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: inherit;
        }

        .tarot-card-front, .tarot-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: inherit;
        }

        .tarot-card-back {
            background: linear-gradient(135deg, #1c1e32 0%, #0d0f20 100%);
            border: 1px solid #4c4355;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }

        .tarot-card-back-inner {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(233, 196, 0, 0.6);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #101225;
        }

        .tarot-card-back img { width: 100%; height: 100%; object-fit: cover; opacity: 0.95; }

        .tarot-card-front {
            background-color: #1c1e32;
            transform: rotateY(180deg);
            overflow: hidden;
        }

        .tarot-card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 결과 카드가 뒤집히면서(공개) 실제 카드 아트가 보임 */
        .tarot-card-wrapper.revealed .tarot-card {
            animation: none;
            transform: rotateY(180deg);
        }
        .tarot-card-wrapper.revealed.reversed .tarot-card {
            transform: rotateY(180deg) rotate(180deg);
        }
        .tarot-card-wrapper.revealed {
            filter: drop-shadow(0 0 15px rgba(233, 196, 0, 0.7)) drop-shadow(0 0 5px rgba(157, 80, 255, 0.5));
        }

        /* ---------- 운세 카테고리 선택 ---------- */
        .category-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }
        .category-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 999px;
            border: 1px solid rgba(206, 194, 215, 0.3);
            color: #cec2d7;
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 13.5px;
            transition: all 0.2s ease;
        }
        .category-chip .material-symbols-outlined { font-size: 18px; }
        .category-chip.active {
            border-color: #d8b9ff;
            background: rgba(157, 80, 255, 0.18);
            color: #eddcff;
            box-shadow: 0 0 12px rgba(157, 80, 255, 0.3);
        }

        /* ---------- 스프레드 선택 토글 ---------- */
        .spread-toggle {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            border-radius: 999px;
            max-width: 100%;
        }
        .spread-toggle button {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11.5px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 999px;
            color: #cec2d7;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .spread-toggle button.active {
            background: linear-gradient(135deg, #e9c400 0%, #b89a00 100%);
            color: #101225;
        }

        /* ---------- 카드 더미(셔플 + 뽑기) ---------- */
        .deck-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 28px;
        }
        .deck-pile {
            position: relative;
            width: 110px;
            height: 170px;
            cursor: pointer;
        }
        .deck-card-back {
            position: absolute;
            inset: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #1c1e32 0%, #0d0f20 100%);
            border: 1px solid rgba(233, 196, 0, 0.55);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            background-image: url('./card-back.jpg');
            background-size: cover;
            background-position: center;
        }
        .deck-card-back--0 { transform: translate(0, 0) rotate(0deg); z-index: 4; }
        .deck-card-back--1 { transform: translate(3px, -3px) rotate(-2deg); z-index: 3; }
        .deck-card-back--2 { transform: translate(6px, -6px) rotate(2deg); z-index: 2; opacity: .9; }
        .deck-card-back--3 { transform: translate(9px, -9px) rotate(-4deg); z-index: 1; opacity: .8; }

        .deck-pile:hover .deck-card-back--0 { transform: translate(0, -6px) rotate(0deg); }

        .deck-pile.is-shuffling .deck-card-back { animation: deckShuffle 0.9s ease-in-out; }
        .deck-card-back--0.is-shuffling, .deck-pile.is-shuffling .deck-card-back--0 { animation-delay: 0s; }
        .deck-pile.is-shuffling .deck-card-back--1 { animation-delay: .08s; }
        .deck-pile.is-shuffling .deck-card-back--2 { animation-delay: .16s; }
        .deck-pile.is-shuffling .deck-card-back--3 { animation-delay: .24s; }

        @keyframes deckShuffle {
            0% { transform: translate(0,0) rotate(0deg); }
            20% { transform: translate(-26px, -10px) rotate(-14deg); }
            40% { transform: translate(22px, -16px) rotate(12deg); }
            60% { transform: translate(-16px, 4px) rotate(-8deg); }
            80% { transform: translate(10px, -4px) rotate(6deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }

        .deck-pile.is-disabled { pointer-events: none; opacity: .55; }

        .shuffle-btn {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #101225;
            background: linear-gradient(135deg, #e9c400 0%, #b89a00 100%);
            border: none;
            padding: 10px 20px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,.35);
            transition: transform .15s ease, box-shadow .2s ease;
        }
        .shuffle-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 0 16px rgba(233,196,0,.55);
        }
        .shuffle-btn:disabled {
            background: #313348;
            color: #cec2d7;
            box-shadow: none;
            cursor: not-allowed;
            opacity: .7;
        }

        .deck-hint {
            margin-top: 14px;
            font-size: 13px;
            color: #cec2d7;
            text-align: center;
        }

        /* ---------- 선택 트레이 (부채꼴 아래, 고른 카드가 따로 모이는 자리) ---------- */
        .selected-tray {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 4px;
            min-height: 96px;
        }
        .tray-slot {
            width: 62px;
            height: 92px;
            border-radius: 6px;
            border: 1px dashed rgba(206, 194, 215, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s ease, background 0.3s ease;
        }
        .tray-slot.filled {
            border: 1px solid rgba(233, 196, 0, 0.7);
            background: linear-gradient(135deg, #1c1e32 0%, #0d0f20 100%);
            box-shadow: 0 0 12px rgba(233, 196, 0, 0.35);
        }
        .tray-slot.filled img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 5px;
            opacity: 0.95;
        }
        @media (prefers-reduced-motion: no-preference) {
            .tray-slot.filled { animation: trayPop 0.35s cubic-bezier(0.34,1.56,0.64,1); }
        }
        @keyframes trayPop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Lucky Button */
        .lucky-btn {
            background: linear-gradient(135deg, #e9c400 0%, #b89a00 100%);
            color: #101225;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .lucky-btn:disabled {
            background: #313348;
            color: #cec2d7;
            box-shadow: none;
            border-color: transparent;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .lucky-btn:not(:disabled):hover {
            box-shadow: 0 0 20px rgba(233, 196, 0, 0.6);
            transform: translateY(-2px);
        }

        .ghost-btn {
            background: transparent;
            border: 1px solid rgba(233, 196, 0, 0.5);
            color: #e9c400;
            transition: all 0.2s ease;
        }
        .ghost-btn:hover { border-color: #e9c400; transform: translateY(-1px); }

        /* ---------- 결과 영역 ---------- */
        #resultSection { display: none; }

        .result-cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .result-card-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 130px;
        }
        .result-card-col .tarot-card-wrapper {
            position: relative;
            bottom: auto; left: auto; margin-left: 0;
            width: 130px; height: 200px;
            transform: none;
        }
        .result-card-col .tarot-card { animation: none; }

        .interpretation p {
            opacity: 0;
            transform: translateY(6px);
        }
        @media (prefers-reduced-motion: no-preference) {
            .interpretation p.is-in { animation: fadeUp 0.5s ease forwards; }
        }
        @media (prefers-reduced-motion: reduce) {
            .interpretation p { opacity: 1; transform: none; }
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .lotto-ball {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e9c400 0%, #b89a00 100%);
            color: #101225;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: scale(0.5);
        }
        @media (prefers-reduced-motion: no-preference) {
            .lotto-ball.is-in { animation: ballPop 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        }
        @media (prefers-reduced-motion: reduce) {
            .lotto-ball { opacity: 1; transform: none; }
        }
        @keyframes ballPop { to { opacity: 1; transform: scale(1); } }

        /* Layout adjustments */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 80px;
            padding-bottom: 88px;
        }
        @media (min-width: 641px) {
            header.fixed { top: 60px !important; }
        }
    </style>

<script>
(function() {
  const canvas = document.getElementById('shader-canvas-bg');

  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 a0 = x - floor(x + 0.5);
  vec3 m0 = 1.0 - 1.5*(a0*a0 + h*h);
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = v_texCoord;
    float n = snoise(uv * 3.0 + u_time * 0.2);
    n += 0.5 * snoise(uv * 6.0 - u_time * 0.4);

    vec3 color1 = vec3(0.06, 0.07, 0.15);
    vec3 color2 = vec3(0.2, 0.0, 0.4);
    vec3 color3 = vec3(0.6, 0.3, 1.0);

    vec3 finalColor = mix(color1, color2, n * 0.5 + 0.5);
    finalColor = mix(finalColor, color3, pow(max(0.0, n), 3.0) * 0.5);

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<!-- ============ 카드 선택 + 타로 엔진 연동 ============ -->
<script type="module">
  import { FULL_DECK } from './tarotDeck.js';
  import { shuffleForSelectionWeighted, buildDrawFromPicks, FORTUNE_CATEGORIES } from './tarotEngine.js';

  const CARD_BACK_IMG = './card-back.jpg';

  const CATEGORY_ICONS = {
    general: 'auto_awesome',
    love: 'favorite',
    career: 'work',
    wealth: 'payments',
    health: 'spa',
  };

  const categoryGrid = document.getElementById('categoryGrid');
  const cardContainer = document.getElementById('cardContainer');
  const trayEl = document.getElementById('selectedTray');
  const countDisplay = document.getElementById('selectionCount');
  const maxDisplay = document.getElementById('selectionMax');
  const resultBtn = document.getElementById('resultBtn');
  const instructionText = document.getElementById('instructionText');
  const deckHint = document.getElementById('deckHint');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const spreadButtons = {
    1: document.getElementById('spreadToggle1'),
    2: document.getElementById('spreadToggle2'),
    3: document.getElementById('spreadToggle3'),
    5: document.getElementById('spreadToggle5'),
  };

  const SPREAD_LABELS = {
    1: '오늘의 카드 1장',
    2: '상황·해결책 2장',
    3: '운명의 카드 3장',
    5: '켈틱 스타일 5장',
  };

  // 78장 전체를 부채꼴로 다 펼치면 너무 빽빽해서, 카테고리 가중치로 이미 섞인
  // 상위 24장만 부채꼴에 보여줍니다 (확률은 78장 전체 기준 그대로 유지됩니다).
  const FAN_SIZE = 24;

  let maxSelection = 3;
  let selectedCategory = 'general';
  let fanPool = [];       // 지금 부채꼴에 보이는(아직 안 고른) 카드들 [{card, reversed}, ...]
  let pickedCards = [];   // 사용자가 고른 카드들, 고른 순서대로 [{card, reversed}, ...]
  let fanWrappers = [];   // fanPool과 같은 순서의 DOM 노드

  function buildCategoryGrid() {
    categoryGrid.innerHTML = '';
    FORTUNE_CATEGORIES.forEach(({ key, label }) => {
      const chip = document.createElement('button');
      chip.className = 'category-chip' + (key === selectedCategory ? ' active' : '');
      chip.dataset.category = key;
      chip.innerHTML = `<span class="material-symbols-outlined">${CATEGORY_ICONS[key] ?? 'auto_awesome'}</span><span>${label}</span>`;
      chip.addEventListener('click', () => {
        selectedCategory = key;
        [...categoryGrid.children].forEach((c) => c.classList.toggle('active', c.dataset.category === key));
        startNewRound(); // 카테고리가 바뀌면 가중치도 바뀌므로 다시 셔플부터
      });
      categoryGrid.appendChild(chip);
    });
  }

  function startNewRound() {
    pickedCards = [];
    buildFan();
    renderTray();
    updateStatus();
  }

  /** FULL_DECK(78장)에서 이미 고른 카드를 뺀 나머지를 카테고리 가중치로 섞어
   *  상위 FAN_SIZE장을 부채꼴로 그립니다. */
  function buildFan() {
    const usedIds = new Set(pickedCards.map((p) => p.card.id));
    const remainingPool = FULL_DECK.filter((c) => !usedIds.has(c.id));
    const shuffled = shuffleForSelectionWeighted(remainingPool, selectedCategory, { dateSeeded: false });
    fanPool = shuffled.slice(0, FAN_SIZE);
    renderFanDOM();
  }

  function renderFanDOM() {
    cardContainer.innerHTML = '';
    fanWrappers = [];
    const total = fanPool.length;

    fanPool.forEach((entry, i) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'tarot-card-wrapper';

      const angle = total > 1 ? -75 + (150 / (total - 1)) * i : 0;
      wrapper.style.setProperty('--r', `${angle}deg`);
      wrapper.style.setProperty('--i', i);
      wrapper.style.setProperty('--z', i);

      wrapper.innerHTML = `
        <div class="tarot-card">
          <div class="tarot-card-inner">
            <div class="tarot-card-back">
              <div class="tarot-card-back-inner">
                <img src="${CARD_BACK_IMG}" alt="로또슬기 카드 뒷면" class="object-cover">
              </div>
            </div>
            <div class="tarot-card-front glass-panel gold-border flex flex-col items-center justify-center">
              <span class="material-symbols-outlined text-tertiary text-3xl mb-1" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
            </div>
          </div>
        </div>
      `;

      wrapper.addEventListener('click', () => pickFromFan(i, wrapper));
      cardContainer.appendChild(wrapper);
      fanWrappers.push(wrapper);
    });
  }

  function pickFromFan(index, wrapper) {
    if (pickedCards.length >= maxSelection) {
      // 최대 개수 초과 시 살짝 흔들어서 안내
      wrapper.style.transform = `rotate(var(--r)) translateY(-10px) translateX(-5px) scale(var(--s))`;
      setTimeout(() => { wrapper.style.transform = `rotate(var(--r)) translateY(-10px) translateX(5px) scale(var(--s))`; }, 100);
      setTimeout(() => { wrapper.style.transform = ''; }, 200);
      return;
    }

    pickedCards.push(fanPool[index]);
    wrapper.classList.add('picked');

    renderTray();
    updateStatus();

    deckHint.textContent = pickedCards.length >= maxSelection
      ? '카드를 모두 뽑았습니다.'
      : `카드를 눌러 뽑아주세요 (${pickedCards.length} / ${maxSelection})`;
  }

  // "카드 섞기" 버튼: 이미 뽑은 카드는 그대로 두고, 부채꼴만 다시 섞습니다.
  shuffleBtn.addEventListener('click', () => {
    deckHint.textContent = '카드를 섞는 중...';
    cardContainer.style.transition = 'opacity .3s ease';
    cardContainer.style.opacity = '0.25';

    setTimeout(() => {
      buildFan();
      cardContainer.style.opacity = '1';
      deckHint.textContent = pickedCards.length >= maxSelection
        ? '카드를 모두 뽑았습니다.'
        : `카드를 눌러 뽑아주세요 (${pickedCards.length} / ${maxSelection})`;
    }, 500);
  });

  function renderTray() {
    trayEl.innerHTML = '';
    for (let i = 0; i < maxSelection; i++) {
      const slot = document.createElement('div');
      if (i < pickedCards.length) {
        slot.className = 'tray-slot filled';
        slot.innerHTML = `<img src="${CARD_BACK_IMG}" alt="뽑은 카드">`;
        slot.title = '다시 누르면 선택이 취소됩니다';
        slot.style.cursor = 'pointer';
        slot.addEventListener('click', () => {
          pickedCards.splice(i, 1);
          buildFan(); // 취소된 카드가 다시 부채꼴 후보에 포함되도록 재구성
          renderTray();
          updateStatus();
          deckHint.textContent = `카드를 눌러 뽑아주세요 (${pickedCards.length} / ${maxSelection})`;
        });
      } else {
        slot.className = 'tray-slot';
      }
      trayEl.appendChild(slot);
    }
  }

  function updateStatus() {
    const count = pickedCards.length;
    countDisplay.textContent = count;
    maxDisplay.textContent = maxSelection;

    if (count === maxSelection) {
      resultBtn.disabled = false;
      resultBtn.classList.add('animate-pulse');
      setTimeout(() => resultBtn.classList.remove('animate-pulse'), 1000);
    } else {
      resultBtn.disabled = true;
    }
  }

  function setSpread(spread) {
    maxSelection = spread;
    Object.entries(spreadButtons).forEach(([key, btn]) => {
      btn.classList.toggle('active', Number(key) === spread);
    });
    instructionText.textContent = `마음을 가다듬고 ${SPREAD_LABELS[spread]}을 선택하세요`;
    startNewRound();
  }

  Object.entries(spreadButtons).forEach(([spread, btn]) => {
    btn.addEventListener('click', () => setSpread(Number(spread)));
  });

  // 카드를 다 고르면 결과는 result.html에서 보여줍니다.
  resultBtn.addEventListener('click', goToResult);

  function goToResult() {
    const draw = buildDrawFromPicks(pickedCards, pickedCards.map((_, i) => i));

    sessionStorage.setItem('tarotDraw', JSON.stringify({
      category: selectedCategory,
      cards: draw.cards.map(({ card, reversed, position, positionLabel }) => ({
        id: card.id,
        reversed,
        position,
        positionLabel,
      })),
    }));

    window.location.href = './result.html';
  }

  // 초기 진입
  buildCategoryGrid();
  startNewRound();

  // 헤더 버튼: 뒤로가기(항상 메인으로) / 지난 기록 / 공유
  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = '../index.html';
  });

  document.getElementById('headerHistoryBtn').addEventListener('click', () => {
    window.location.href = './history.html';
  });

  document.getElementById('headerShareBtn').addEventListener('click', async () => {
    const shareData = {
      title: '로또슬기 타로 운세',
      text: '웨이트 타로로 오늘의 운세를 보고, 같은 카드로 로또 번호까지 받아보세요.',
      url: window.location.href,
    };

    if (navigator.share) {
      try { await navigator.share(shareData); } catch (e) { /* 취소는 무시 */ }
      return;
    }

    try {
      await navigator.clipboard.writeText(`${shareData.text}\n${shareData.url}`);
      alert('링크가 클립보드에 복사되었습니다.');
    } catch (e) {
      // 클립보드 API도 없는 아주 오래된 환경 — 조용히 무시
    }
  });
</script>

</body></html>
